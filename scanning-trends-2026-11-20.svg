<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1190" role="img" aria-labelledby="title desc">
<title id="title">扫描行业竞争重心正在往哪里走</title>
<desc id="desc">四条演进方向及公开产品证据，区分已落地、厂商预告和用户需求信号。战略建议为编辑判断。</desc>
<rect width="1600" height="1190" fill="#faf8f3"/>
<text x="64" y="56" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#b65b40">行业方向图 / 2026.11.20</text>
<text x="64" y="127" font-family="Microsoft YaHei, sans-serif" font-size="48" font-weight="700" fill="#302e2b">扫描行业：从“采得准”走向“交付好”</text>
<text x="64" y="177" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="400" fill="#302e2b">精度仍是基础，新的竞争增量在完整任务的成功率、总耗时与使用门槛。</text>
<text x="64" y="217" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#777269">以下为公开产品与用户反馈形成的方向判断，不代表市场份额或全行业普及程度。</text>
<text x="86" y="283" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#777269">过去常见重心</text>
<text x="465" y="283" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#777269">正在出现的变化 / 证据</text>
<text x="1120" y="283" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#b65b40">给产品与战略的启示</text>
<rect x="64" y="310" width="1472" height="143" rx="12" fill="#f0ece3" stroke="#f0ece3"/>
<text x="86" y="350" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#b65b40">01  采集方式</text>
<text x="86" y="397" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#302e2b">连接电脑、依赖现场配置</text>
<path d="M397,390h40m-11,-6l11,6l-11,6" stroke="#b65b40" stroke-width="3" fill="none"/>
<text x="465" y="355" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#302e2b">移动化 / 无线化 / 一体化</text>
<text x="465" y="386" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#b65b40">已落地</text>
<text x="465" y="425" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#777269">EZ GO支持手机端；FreeScan Omni集成处理。[1][2]</text>
<text x="1120" y="358" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#302e2b">先降低现场使用负担</text>
<text x="1120" y="406" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#777269">比较部署时间、续航与恢复成本</text>
<rect x="64" y="467" width="1472" height="143" rx="12" fill="#f0ece3" stroke="#f0ece3"/>
<text x="86" y="507" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#b65b40">02  处理流程</text>
<text x="86" y="554" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#302e2b">操作员逐步完成后处理</text>
<path d="M397,547h40m-11,-6l11,6l-11,6" stroke="#b65b40" stroke-width="3" fill="none"/>
<text x="465" y="512" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#302e2b">从操作工具走向任务流程</text>
<text x="465" y="543" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#b65b40">厂商预告</text>
<text x="465" y="582" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#777269">MIRACO 2公布Revo Agents与下游任务方向。[3]</text>
<text x="1120" y="515" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#302e2b">按完整任务验收自动化</text>
<text x="1120" y="563" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#777269">验证人工干预次数与端到端耗时</text>
<rect x="64" y="624" width="1472" height="143" rx="12" fill="#f0ece3" stroke="#f0ece3"/>
<text x="86" y="664" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#b65b40">03  交付结果</text>
<text x="86" y="711" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#302e2b">以点云、网格为主要终点</text>
<path d="M397,704h40m-11,-6l11,6l-11,6" stroke="#b65b40" stroke-width="3" fill="none"/>
<text x="465" y="669" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#302e2b">面向CAD / 检测 / 打印</text>
<text x="465" y="700" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#b65b40">需求与预告</text>
<text x="465" y="739" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#777269">用户提出STEP需求；拓竹S1预告11月。[4][5]</text>
<text x="1120" y="672" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#302e2b">围绕下游可用性定位</text>
<text x="1120" y="720" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#777269">评估几何质量、尺度与编辑成本</text>
<rect x="64" y="781" width="1472" height="143" rx="12" fill="#f0ece3" stroke="#f0ece3"/>
<text x="86" y="821" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#b65b40">04  客户经营</text>
<text x="86" y="868" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#302e2b">单次卖硬件、比较参数</text>
<path d="M397,861h40m-11,-6l11,6l-11,6" stroke="#b65b40" stroke-width="3" fill="none"/>
<text x="465" y="826" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#302e2b">软件支持与老客升级价值</text>
<text x="465" y="857" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#b65b40">用户需求信号</text>
<text x="465" y="896" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#777269">先临旧款适配、Revopoint换购与兼容提问。[6]</text>
<text x="1120" y="829" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#302e2b">把生命周期承诺讲清楚</text>
<text x="1120" y="877" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#777269">明确支持期、兼容范围与升级费用</text>
<rect x="64" y="954" width="1472" height="72" rx="12" fill="#e8dfd2" stroke="#e8dfd2"/>
<text x="86" y="1000" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#302e2b">领导可追问：目标客户的哪项任务，能更快完成、更少返工，并愿意为此付费？</text>
<text x="64" y="1063" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#777269">证据索引： [1] EXStar Mobile下载说明  [2] 先临Formnext公告  [3] Revopoint MIRACO 2公告</text>
<text x="64" y="1094" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#777269">[4] Creality公开群用户需求  [5] 拓竹10月12日官方预告  [6] 先临与Revopoint公开群反馈</text>
<text x="64" y="1128" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#777269">说明：预告不等于已交付；用户个案不代表普遍问题；右列为编辑建议，尚需客户与经营数据验证。</text>
</svg>